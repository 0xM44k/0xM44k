<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="0xM44k — Penetration Tester and Security Tooling">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070a"/>
      <stop offset="1" stop-color="#0a0f16"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f3ff"/>
      <stop offset="1" stop-color="#00ff88"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#17202b" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect x="0" y="0" width="1200" height="300" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)" opacity="0.6"/>

    <!-- sweeping scan line -->
    <rect x="-220" y="0" width="220" height="300" fill="#00f3ff" opacity="0.06">
      <animate attributeName="x" from="-220" to="1200" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- corner reticles -->
    <path d="M24 18H60M24 18V54" stroke="#00f3ff" stroke-width="2" fill="none" opacity="0.8"/>
    <path d="M1176 282H1140M1176 282V246" stroke="#00ff88" stroke-width="2" fill="none" opacity="0.8"/>

    <!-- mono tag -->
    <text x="64" y="70" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="15" letter-spacing="6" fill="#5d6b7e">SYS://0xM44k.SEC</text>

    <!-- name -->
    <text x="60" y="168" font-family="'Segoe UI',Syne,Inter,sans-serif" font-size="92" font-weight="800" letter-spacing="-2" fill="#e7ecf3">0xM44k</text>
    <!-- underline reveal -->
    <rect x="62" y="186" width="0" height="4" fill="url(#accent)">
      <animate attributeName="width" from="0" to="430" dur="1.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.3 1" keyTimes="0;1" values="0;430"/>
    </rect>

    <!-- role -->
    <text x="64" y="232" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="24" fill="#9aa7b8">Penetration Tester <tspan fill="#00f3ff">//</tspan> Security Tooling Engineer</text>

    <!-- blinking cursor -->
    <rect x="690" y="214" width="12" height="22" fill="#00ff88">
      <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite" keyTimes="0;0.5;0.5;1"/>
    </rect>

    <!-- stat chips -->
    <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13" fill="#9aa7b8">
      <rect x="860" y="60" width="120" height="30" rx="6" fill="#0e1620" stroke="#17202b"/><text x="878" y="80">7 tools</text>
      <rect x="990" y="60" width="150" height="30" rx="6" fill="#0e1620" stroke="#17202b"/><text x="1008" y="80">137 tests pass</text>
      <rect x="860" y="100" width="120" height="30" rx="6" fill="#0e1620" stroke="#17202b"/><text x="878" y="120">0 fabricated</text>
      <rect x="990" y="100" width="150" height="30" rx="6" fill="#0e1620" stroke="#17202b"/><text x="1008" y="120">offline · auditable</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="14" fill="none" stroke="#17323f"/>
</svg>
